name: Backend and frontend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ide
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cloud_ide_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ide -d cloud_ide_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --workspace=server
        env:
          DATABASE_URL: postgresql://ide:ci-only-password@localhost:5432/cloud_ide_test
          TEST_DATABASE_URL: postgresql://ide:ci-only-password@localhost:5432/cloud_ide_test
      - run: npm run build
