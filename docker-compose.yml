services:
  # ── Main IDE Application ──
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3001}
      - ENABLE_HOST_TERMINAL=${ENABLE_HOST_TERMINAL:-false}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      - PGHOST=postgres
      - PGDATABASE=cloud_ide
      - PGUSER=ide
      - PGPASSWORD=${POSTGRES_PASSWORD:-local-development-only}
      - DATABASE_URL=postgresql://postgres:5432/cloud_ide
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    networks:
      - ide-network

  # ── Redis (job queue & caching) ──
  redis:
    profiles: [infrastructure]
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ide-network

  # ── PostgreSQL (project & user data) ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloud_ide
      POSTGRES_USER: ide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ide -d cloud_ide"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ide-network

  # ── Code Execution Sandbox (isolated containers) ──
  sandbox:
    profiles: [sandbox]
    build:
      context: ./infrastructure/sandbox
      dockerfile: Dockerfile
    environment:
      - MAX_EXECUTION_TIME=30
      - MAX_MEMORY_MB=256
    restart: unless-stopped
    networks:
      - ide-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  redis-data:
  postgres-data:

networks:
  ide-network:
    driver: bridge
